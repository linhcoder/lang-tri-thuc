# Included inside aaPanel's existing ltt.vui-hoc.xyz server block.
# Keep the site's original root/cert renewal integration and all other vhosts.
location ^~ /.well-known/ {
    auth_basic off;
    root /www/wwwroot/ltt.vui-hoc.xyz;
}
location = /game { return 301 https://$host/game/; }
location ^~ /api/internal/ { return 403; }
location ^~ /api/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:33080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    access_log off;
}
location ^~ /colyseus/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:32580/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_buffering off;
    access_log off;
}
location ^~ /game/ {
    if ($scheme = http) { return 301 https://$host$request_uri; }
    alias /opt/lang-tri-thuc/current/public/game/;
    index index.html;
    auth_basic "Lang Tri Thuc preview";
    auth_basic_user_file /etc/lang-tri-thuc/preview.htpasswd;
    add_header Cache-Control "no-cache";
    access_log off;
}
location ^~ / {
    if ($scheme = http) { return 301 https://$host$request_uri; }
    root /opt/lang-tri-thuc/current/public/admin;
    index index.html;
    try_files $uri $uri/ /index.html;
    auth_basic "Lang Tri Thuc preview";
    auth_basic_user_file /etc/lang-tri-thuc/preview.htpasswd;
    add_header Cache-Control "no-cache";
    access_log off;
}
