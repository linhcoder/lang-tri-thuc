services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lang_tri_thuc
      MYSQL_USER: lang_tri_thuc_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a separate root password}
    volumes: ["mysql_database:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: {context: .., dockerfile: deploy/Dockerfile}
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: mysql://lang_tri_thuc_app:${MYSQL_PASSWORD}@mysql:3306/lang_tri_thuc
      ROOM_SECRET: ${ROOM_SECRET:?Set room signing secret}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?Set admin password}
      ALLOWED_ORIGINS: https://${DOMAIN}
    depends_on:
      mysql: {condition: service_healthy}
    restart: unless-stopped
  rooms:
    build: {context: .., dockerfile: deploy/Dockerfile}
    command: ["node", "apps/game-server/dist/game-server/src/main.js"]
    environment:
      HOST: 0.0.0.0
      ROOM_SECRET: ${ROOM_SECRET}
      API_URL: http://api:3000
    depends_on: [api]
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set staging domain}
      STAGING_PASSWORD_HASH: ${STAGING_PASSWORD_HASH:?Set Caddy password hash}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/game-client/build/web-desktop:/srv/game:ro
      - ../apps/admin/dist:/srv/admin:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, rooms]
    restart: unless-stopped
volumes:
  mysql_database:
  caddy_data:
  caddy_config:
